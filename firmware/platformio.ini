[platformio]
default_envs = rider2-rl-only
src_dir = src
include_dir = include

[env:rider2-firmware]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.0
    espressif/toolchain-xtensa-esp32@8.4.0+2021r2-patch5
board_build.partitions = partitions.csv
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_upload.flash_size = 4MB
board_upload.maximum_size = 1572864
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall -Wextra -ffp-contract=off -DRIDER2_MOTOR_OUTPUT=1 -Wl,--wrap=nvs_flash_init -ffile-prefix-map=${platformio.packages_dir}=/pio-packages -ffile-prefix-map=$PROJECT_DIR=/rider2-firmware

[env:rider2-trained]
extends = env:rider2-firmware
build_flags = ${env:rider2-firmware.build_flags} -DRIDER2_TRAINED_POLICY=1

[env:rider2-rl-only]
extends = env:rider2-firmware
build_flags = ${env:rider2-firmware.build_flags} -DRIDER2_TRAINED_POLICY=1 -DRIDER2_RL_ONLY=1
build_src_filter = +<*> -<motion_controller.cpp>

